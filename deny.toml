    { id = "RUSTSEC-2024-0415", reason = "transitive GTK3 dependency required by Tauri on Linux; no safe upgrade is available" },
    { id = "RUSTSEC-2024-0416", reason = "transitive GTK3 dependency required by Tauri on Linux; no safe upgrade is available" },
    { id = "RUSTSEC-2024-0417", reason = "transitive GTK3 dependency required by Tauri on Linux; no safe upgrade is available" },
