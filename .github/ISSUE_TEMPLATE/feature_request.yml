name: Feature request
description: Propose a focused product or protocol improvement
title: "feature: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: invariants
    attributes:
      label: Replication and security considerations
      description: How should this behave during partitions, retries, and failures?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
